[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syllabus-rag-assistant"
version = "0.1.0"
description = "Syllabus-aware DS/AoA NLP question answering with Qdrant hybrid retrieval and source-grounded generation"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pypdf>=4.0",
    "pymupdf>=1.24",
    "sentence-transformers>=2.7",
    "qdrant-client>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]
ocr = [
    "paddleocr>=3.0",
]
web = [
    "tavily-python",
    "duckduckgo-search",
    "trafilatura",
]
docling = [
    "docling",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
