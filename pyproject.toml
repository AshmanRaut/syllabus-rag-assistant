[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syllabus-rag-assistant"
version = "0.1.0"
description = "Syllabus-aware DS/AoA NLP question answering with Qdrant hybrid retrieval and source-grounded generation"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
